<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign-in</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div class="auth-wrapper">
    <form th:action="@{/sign-in}" method="post">
        <h2>Вход</h2>
        <div class="input-field">
            <input th:type="text" th:name="username" required>
            <label>Введите вашу почту</label>
        </div>
        <div class="input-field">
            <input th:type="password" th:name="password" required>
            <label>Введите ваш пароль</label>
        </div>
        <div class="password-options">
            <label for="remember">
                <input type="checkbox" id="remember">
                <p>Запомнить меня</p>
            </label>
            <a href="">Забыл пароль</a>
        </div>
        <button type="submit">Вход</button>
        <div class="account-options">
            <p>Не зарегистрированы? <a th:href="@{/sign-up}">Регистрация</a></p>
        </div>
    </form>
</div>
</body>
</html>
