spring:
  application:
    name: NauJava

  main:
    allow-bean-definition-overriding: true

  messages:
    encoding: UTF-8

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: true
        highlight_sql: true
        hbm2ddl:
          auto: update

jwt:
  cookie-token-key: '{"kty":"oct","k":"956PBFst1FguLr5irJD-aQ"}'

server:
  http2:
    enabled: true
  ssl:
    key-store: 'путь'
    key-store-password: 'пароль'
    key-alias: localhost
  port: 8443

logging:
  level:
    org.springframework.security: trace

management:
  endpoints:
    web:
      exposure:
        include: "*"
