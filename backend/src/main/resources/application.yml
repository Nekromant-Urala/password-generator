spring:
  application:
    name: NauJava

  main:
    allow-bean-definition-overriding: true

  messages:
    encoding: UTF-8

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 20000

  sql:
    init:
      data-locations: classpath:sql/init.sql
      mode: always

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

    hibernate:
      ddl-auto: create-drop

    properties:
      hibernate:
        format_sql: true
        show_sql: true
        highlight_sql: true

    defer-datasource-initialization: true

server:
  port: 8080

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibaenate.orm.results: TRACE
  file:
    name: ./logs/app.log
  logback:
    rollingpolicy:
      file-name-pattern: ./logs/app-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      total-size-cap: 10GB
      max-history: 10

management:
  endpoints:
    web:
      exposure:
        include: "*"
