spring:
  application:
    name: NauJava

  main:
    allow-bean-definition-overriding: true

  messages:
    encoding: UTF-8

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      data-locations: classpath:sql/init.sql
      mode: always

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: true
        highlight_sql: true
        hbm2ddl:
          auto: create-drop
    defer-datasource-initialization: true

server:
  port: 8080

logging:
  level:
    root: INFO
  file:
    name: ./logs/app.log
  logback:
    rollingpolicy:
      file-name-pattern: ./logs/app-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      total-size-cap: 10GB
      max-history: 10

management:
  endpoints:
    web:
      exposure:
        include: "*"
