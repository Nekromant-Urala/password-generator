spring:
  application:
    name: NauJava

  messages:
    encoding: UTF-8

  datasource:
    url: jdbc:postgresql://localhost:5432/test
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: create-drop

    properties:
      hibernate:
        format_sql: true
        show_sql: true
        highlight_sql: true

  test:
    database:
      replace: none
