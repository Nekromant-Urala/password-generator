services:
  db:
    image: postgres:17
    container_name: naujava-db
    environment:
      POSTGRES_USER: nau_user
      POSTGRES_PASSWORD: nau_password
      POSTGRES_DB: naujava_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nau_user -d naujava_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naujava-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/naujava_db
      DB_USERNAME: nau_user
      DB_PASSWORD: nau_password
    depends_on:
      db:
        condition: service_healthy
